groups:
  - name: stellar-nebula-nomad-critical
    interval: 30s
    rules:

      # Contract invocation error rate > 5%
      - alert: HighContractErrorRate
        expr: |
          (
            rate(nebula_contract_errors_total[5m])
            /
            rate(nebula_contract_invocations_total[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High contract error rate ({{ $value | humanizePercentage }})"
          description: "Contract error rate has exceeded 5% for more than 2 minutes."

      # Gas usage per transaction > 1M instructions
      - alert: HighGasUsage
        expr: |
          histogram_quantile(0.95,
            rate(nebula_contract_gas_instructions_bucket[10m])
          ) > 1000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High gas usage detected (p95 > 1M instructions)"
          description: "95th percentile gas usage has exceeded 1,000,000 CPU instructions."

      # Transaction throughput drops below 1 tx/min
      - alert: LowTransactionThroughput
        expr: |
          rate(nebula_contract_invocations_total[5m]) < 0.016
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low transaction throughput"
          description: "Transaction throughput has dropped below 1 per minute for 10 minutes."

      # Horizon RPC latency p99 > 3s
      - alert: SlowHorizonRpc
        expr: |
          histogram_quantile(0.99,
            rate(horizon_request_duration_seconds_bucket[5m])
          ) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Slow Horizon RPC responses (p99 > 3s)"
          description: "Horizon RPC 99th percentile latency has exceeded 3 seconds."

      # Node memory > 90%
      - alert: HighMemoryUsage
        expr: |
          (
            1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          ) > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage ({{ $value | humanizePercentage }})"
          description: "Host memory usage has exceeded 90% for 5 minutes."

      # Node disk > 85%
      - alert: HighDiskUsage
        expr: |
          (
            1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} /
                 node_filesystem_size_bytes{fstype!="tmpfs"})
          ) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage ({{ $value | humanizePercentage }})"
          description: "Disk usage has exceeded 85% on {{ $labels.mountpoint }}."

      # Prometheus target down
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target down: {{ $labels.job }}"
          description: "Scrape target {{ $labels.instance }} ({{ $labels.job }}) is unreachable."

      # Soroban contract transaction success rate < 95%
      - alert: SorobanTxSuccessRateLow
        expr: |
          (
            rate(soroban_tx_success_total[5m])
            /
            (rate(soroban_tx_success_total[5m]) + rate(soroban_tx_failure_total[5m]))
          ) < 0.95
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Soroban transaction success rate {{ $value | humanizePercentage }}"
          description: "Transaction success rate has dropped below 95%."

      # Soroban gas usage spike detection
      - alert: SorobanGasUsageSpike
        expr: |
          rate(soroban_gas_used_total[5m]) > (rate(soroban_gas_used_total[1h] offset 1h) * 1.5)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Soroban gas usage spike detected"
          description: "Gas usage has increased by more than 50% in the last 5 minutes."

      # Cache expiration rate too high
      - alert: CacheTTLExpirationsHigh
        expr: |
          rate(cache_expirations_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High cache expiration rate"
          description: "Cache entries are expiring at a high rate (>100 per minute)."

      # Stale data detected in yield forecasts
      - alert: StaleYieldForecastData
        expr: |
          yield_forecast_stale_entries > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Stale data in yield forecasts"
          description: "Stale forecast entries detected - immediate invalidation required."

      # Migration in progress but incomplete
      - alert: MigrationTimeout
        expr: |
          (time() - migration_started_timestamp) > 3600 AND migration_status == "in_progress"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Migration timeout - exceeded 1 hour"
          description: "Data migration has been running for over 1 hour."

      # Active user count anomaly
      - alert: ActiveUserCountAnomalous
        expr: |
          abs(
            rate(soroban_active_users[1h])
            - avg_over_time(rate(soroban_active_users[1h])[24h:1h])
          ) > 2 * stddev_over_time(rate(soroban_active_users[1h])[24h:1h])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Anomalous active user count"
          description: "Active user count deviates significantly from historical average."